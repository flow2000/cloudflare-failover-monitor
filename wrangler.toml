name = "cloudflare-failover-monitor"
main = "src/index.js"
compatibility_date = "2025-10-01"

# Cron 触发器：每分钟检测一次
[triggers]
crons = ["* * * * *"]

# KV 命名空间：存储站点状态与检测历史
# 创建命令：npx wrangler kv namespace create MONITOR_KV
[[kv_namespaces]]
binding = "MONITOR_KV"
id = "273e5197313f464d8135d1dd925a703a"

[vars]
# 站点配置（JSON 数组，需写成单行），字段说明见 README「配置说明」
# 主节点为当前线上 CNAME 指向；如需自动故障切换，请在 nodes 中追加备用节点
SITES_CONFIG = '[{"name":"必应壁纸","url":"https://bimg.cc/","icon":"https://bimg.cc/static/favicon.ico","zoneId":"fdd7083ea4434bbcbe3d8df035dc6b83","recordName":"bimg.cc","nodes":[{"name":"主节点-vercel","cname":"8cf1a1a716d4feea.vercel-dns-017.com","checkUrl":"https://www-bimg.vercel.app/"},{"name":"副节点-netlify","cname":"www-bimg.netlify.app","checkUrl":"https://www-bimg.netlify.app/"}]},{"name":"必应壁纸API","url":"http://api.bimg.cc/all","zoneId":"fdd7083ea4434bbcbe3d8df035dc6b83","recordName":"api.bimg.cc","proxied":false,"failOn":["4xx","error"],"nodes":[{"name":"主节点-vercel","cname":"8deb952b01f38dfd.vercel-dns-017.com","checkUrl":"https://api-bimg-abcds.vercel.app"},{"name":"副节点-netlify","cname":"api-bimg.netlify.app","checkUrl":"https://api-bimg.netlify.app"}]},{"name":"个人网站","url":"https://aqcoder.cn/","icon":"https://aqcoder.cn/assets/img/favicon.png","zoneId":"ac1c85b6ed4cb1df8d869a40fbb5dbcb","recordName":"aqcoder.cn","nodes":[{"name":"Netlify","cname":"aqcoder.netlify.app"}]},{"name":"个人博客","url":"https://blog.aqcoder.cn","zoneId":"ac1c85b6ed4cb1df8d869a40fbb5dbcb","recordName":"blog.aqcoder.cn","failOn":["4xx","error"],"nodes":[{"name":"主节点-vercel","cname":"a41a7463834f90f3.vercel-dns-017.com","checkUrl":"https://blog-aqcoder.vercel.app"},{"name":"副节点-netlify","cname":"blog-aqcoder.netlify.app","checkUrl":"https://blog-aqcoder.netlify.app"}]}]'
# 失败判定规则，逗号分隔，可选: 4xx / 5xx / error（网络错误与超时）
FAIL_ON = "4xx,5xx,error"
# 单次探测超时时间（毫秒）
CHECK_TIMEOUT_MS = "8000"
# 连续失败多少次后触发 CNAME 切换
FAILURE_THRESHOLD = "2"
# 每个站点保留的历史记录条数
HISTORY_LIMIT = "50"
# 面板访问口令（可选）。设置后访问面板需带 ?token=xxx
# 建议改用 secret 注入：npx wrangler secret put DASH_TOKEN
# DASH_TOKEN = ""

# 敏感配置请使用 secret 注入，切勿写入本文件：
#   npx wrangler secret put CF_API_TOKEN
